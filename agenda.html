<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Agenda do dia</title>
</head>

<body>
    <div id="menu"></div>

    <main>

        <header class="header">
            <div>
                <p class="nome-page">Agenda do dia</p>
                <p class="data" id="data">Data</p>
            </div>
            <div>
                <button>+ Novo Agendamento</button>
            </div>
        </header>

        <div class="agenda">
            <div class="header-agenda">
                <p class="titulo hora-titulo">Hora</p>
                <p class="titulo agendamento-titulo">Agendamento</p>
            </div>

            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente concluido">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Profissional
                    </p>
                </div>
            </div>

            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente concluido">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Profissional
                    </p>
                </div>
            </div>

            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente emandamento">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Profissional
                    </p>
                </div>
            </div>
            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente emandamento">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Val
                    </p>
                </div>
            </div>
            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente naoiniciado">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Profissional
                    </p>
                </div>
            </div>
            <div class="linha-agenda">
                <div class="linha-hora">
                    <p>00:00</p>
                </div>
                <div class="linha-cliente naoiniciado">
                    <p class="cliente">Cliente</p>
                    <p class="procedimento">Procedimento</p>
                    <p class="profissional">
                        <i class="ti ti-users"></i>
                        Profissional
                    </p>
                </div>
            </div>

        </div>

    </main>

    <script src="menu.js"></script>

</html>
