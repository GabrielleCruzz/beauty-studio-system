<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="script.js" defer></script>
    <script src="financeiro.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Financeiro</title>
</head>

<body>
    <div id="menu"></div>

    <main>
        <header class="header">
            <div>
                <p class="nome-page">Financeiro</p>
                <p class="data" id="data">Data</p>
            </div>
        </header>

        <div class="cards-f">
            <div class="card-f">
                <div class="dec-f"></div>
                <i class="ti ti-trending-up"></i>
                <p id="mes-atual"></p>
                <p class="valor">R$8.750,00</p>
            </div>

            <div class="card-f">
                <div class="dec-f"></div>
                <i class="ti ti-trending-up"></i>
                <p>FATURAMENTO DA SEMANA</p>
                <p class="valor">R$2.320,00</p>
            </div>

            <div class="card-f">
                <div class="dec-f"></div>
                <i class="ti ti-trending-up"></i>
                <p>FATURAMENTO DO DIA</p>
                <p class="valor">R$350,00</p>
            </div>

        </div>

    </main>

    <script src="menu.js"></script>
</body>

</html>
