<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/menu.js" defer></script>
    <script src="../js/clients.js" defer></script>
    <title>Clientes</title>
</head>

<body>
    <div id="menu"></div>
    <main>
        <header class="header">
            <div>
                <p class="nome-page">Clientes</p>
                <p class="data" id="data">Data</p>
            </div>
            <button id="abrir-modal" type="button">+ Adicionar novo cliente</button>
        </header>

        <section class="clientes-conteudo" aria-label="Lista de clientes">
            <div class="busca">
                <input class="campo-busca" id="busca-cliente" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente por nome ou telefone">
                <i class="ti ti-search" aria-hidden="true"></i>
            </div>
            <p class="mensagem-clientes" id="erro-clientes" role="alert" hidden></p>
            <div class="clientes-grid" id="lista-clientes">
                <article class="cliente-card" data-id="maria" data-nome="Maria" data-telefone="(11) 99999-9999">
                    <div class="cliente-card-info">
                        <h2>Maria</h2>
                        <p>(11) 99999-9999</p>
                    </div>
                    <a class="btn-ver-cliente" href="client-details.html?id=maria" aria-label="Ver informações de Maria">
                        <span>Mais informações</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </article>
                <article class="cliente-card" data-id="ana" data-nome="Ana" data-telefone="(11) 88888-8888">
                    <div class="cliente-card-info">
                        <h2>Ana</h2>
                        <p>(11) 88888-8888</p>
                    </div>
                    <a class="btn-ver-cliente" href="client-details.html?id=ana" aria-label="Ver informações de Ana">
                        <span>Mais informações</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </article>
                <article class="cliente-card" data-id="camila" data-nome="Camila" data-telefone="(11) 97777-7777">
                    <div class="cliente-card-info">
                        <h2>Camila</h2>
                        <p>(11) 97777-7777</p>
                    </div>
                    <a class="btn-ver-cliente" href="client-details.html?id=camila" aria-label="Ver informações de Camila">
                        <span>Mais informações</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </article>
                <article class="cliente-card" data-id="juliana" data-nome="Juliana" data-telefone="(11) 96666-6666">
                    <div class="cliente-card-info">
                        <h2>Juliana</h2>
                        <p>(11) 96666-6666</p>
                    </div>
                    <a class="btn-ver-cliente" href="client-details.html?id=juliana" aria-label="Ver informações de Juliana">
                        <span>Mais informações</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </article>
                <article class="cliente-card" data-id="fernanda" data-nome="Fernanda" data-telefone="(11) 95555-5555">
                    <div class="cliente-card-info">
                        <h2>Fernanda</h2>
                        <p>(11) 95555-5555</p>
                    </div>
                    <a class="btn-ver-cliente" href="client-details.html?id=fernanda" aria-label="Ver informações de Fernanda">
                        <span>Mais informações</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </article>
            </div>
            <p class="mensagem-clientes" id="nenhum-cliente" hidden>Nenhum cliente encontrado.</p>
        </section>
    </main>

    <div class="overlay" id="overlay-add-cliente">
        <div class="modal modal-add-cliente">
            <div class="modal-header">
                <h1>Adicionar nova cliente</h1>
                <button class="fechar" id="fechar-modal" type="button" aria-label="Fechar">
                    <i class="ti ti-x"></i>
                </button>
            </div>
            <form class="form-add-cliente" id="form-add-cliente">
                <div class="campo">
                    <label for="nome">Cliente</label>
                    <input id="nome" type="text" placeholder="Nome da cliente" required>
                </div>
                <div class="campo">
                    <label for="tel">Telefone</label>
                    <input id="tel" type="tel" placeholder="Telefone da cliente" maxlength="15" required>
                </div>
                <div class="campo">
                    <label for="obs">Observações</label>
                    <textarea id="obs" rows="4" placeholder="Digite alguma observação..."></textarea>
                </div>
                <div class="acoes">
                    <button type="submit" class="salvar">Cadastrar cliente</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
